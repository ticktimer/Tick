# Docs site only (docs/). Repo root is correct for netlify.toml even with
# base set — Netlify always looks for the file at the repo root unless base
# or package directory is used to point it elsewhere.
[build]
  base    = "docs"
  command = "npm run generate"
  # Relative to base. On Netlify, Nitro auto-selects the netlify-static preset
  # for `nuxt generate` and writes a real docs/dist (not .output/public/dist,
  # which is a symlink with an absolute target when generated locally).
  publish = "dist"

  # Runs with cwd = base (docs/), so "." is docs/ and "../netlify.toml" is this
  # file. Exit 0 = skip the build, exit 1 = run it (Netlify's ignore-command
  # convention, opposite of a shell truth value).
  #   - CACHED_COMMIT_REF == COMMIT_REF (no prior cached commit, e.g. first
  #     build) would make a bare `git diff --quiet` wrongly report "no diff"
  #     and skip; the `test ... != ...` guard forces a build in that case.
  #   - Otherwise: build only if docs/ or this file changed between the two
  #     commits; an unresolvable ref makes git exit 128, which also builds.
  ignore = 'test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../netlify.toml'

[build.environment]
  # Verified: better-sqlite3 13.0.3 prebuilds need >=22.19; nuxt 4.5.2 needs
  # ^22.19.0 || ^24.11.0 || >=26. This is the exact version the build was run with.
  NODE_VERSION = "22.23.2"

# No [[headers]] block here: the netlify-static preset already writes a
# dist/_headers file with correct, more specific rules (hashed /_nuxt/*
# assets at 1y immutable, but /_nuxt/builds/* — Nuxt's build-manifest poll
# target — at max-age=1, and /_nuxt/builds/meta/* at 1y). A toml `/_nuxt/*`
# rule here would also match builds/*, conflict with Nitro's own max-age=1
# for it (confirmed: `netlify build --dry` warns "the same header is set
# twice with different cases for /_nuxt/*"), and add nothing for the
# already-covered hashed assets.

# The one header rule worth adding by hand. Generated social cards land in
# /_og/ with the template props encoded in the filename (or hashed into it when
# that name would get too long), so a card is content-addressed the same way a
# hashed /_nuxt/ asset is — change the title and the URL changes with it. Nitro
# writes no rule for this path, so unlike a `/_nuxt/*` rule here there is
# nothing to conflict with; without it the cards inherit Netlify's default
# must-revalidate and every crawler re-fetches them.
[[headers]]
  for = "/_og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
